name: Build SEBY FOLDER APK

on:
workflow_dispatch:
push:
branches: [main]
paths:
- 'android/**'
- '.github/workflows/android.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Get project files
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Locate Android Gradle project
    id: locate
    shell: bash
    run: |
      echo "Repository root:"
      pwd
      echo "Searching for Gradle settings files..."
      find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
        -not -path './.git/*' -print

      PROJECT_DIR=""

      for FILE in \
        ./android/settings.gradle \
        ./android/settings.gradle.kts \
        ./android/android/settings.gradle \
        ./android/android/settings.gradle.kts \
        ./android/android/android/settings.gradle \
        ./android/android/android/settings.gradle.kts \
        ./settings.gradle \
        ./settings.gradle.kts
      do
        if [ -f "$FILE" ]; then
          PROJECT_DIR="$(dirname "$FILE")"
          break
        fi
      done

      if [ -z "$PROJECT_DIR" ]; then
        echo "::error::No Android Gradle project found. Check the settings.gradle paths printed above."
        exit 1
      fi

      if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
         [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
        echo "::error::The project was found, but app/build.gradle or app/build.gradle.kts is missing."
        exit 1
      fi

      echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      echo "Android project found at: $PROJECT_DIR"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build debug APK
    working-directory: ${{ steps.locate.outputs.project_dir }}
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: SEBY-FOLDER-APK
      path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
