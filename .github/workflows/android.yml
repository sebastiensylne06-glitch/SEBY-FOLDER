
name: Build SEBY FOLDER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android.yml"
      - "android/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Check Android project
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Android project missing: android/gradlew"
            echo "Add the Android project before building the APK."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SEBY-FOLDER-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
